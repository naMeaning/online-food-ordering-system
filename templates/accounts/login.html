{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto card">
  <h1 class="text-lg font-semibold mb-3">登录</h1>

  {% if form and form.errors %}
    <div class="mb-3 text-rose-700 text-sm">用户名或密码错误</div>
  {% endif %}
  {% if messages %}
    <div class="mb-3 space-y-1">
      {% for m in messages %}
        <div class="text-sm {% if m.tags == 'error' %}text-rose-700{% else %}text-emerald-700{% endif %}">
          {{ m }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <form method="post" action="">
    {% csrf_token %}
    <div class="mb-3">
      <label class="block text-sm mb-1">用户名</label>
      <input name="username" required class="rounded border w-full p-2" autocomplete="username">
    </div>
    <div class="mb-4">
      <label class="block text-sm mb-1">密码</label>
      <input type="password" name="password" required class="rounded border w-full p-2" autocomplete="current-password">
    </div>

    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

    <button class="btn w-full">登录</button>
  </form>

  <div class="text-sm text-slate-600 mt-3">
    没有账号？<a href="{% url 'register' %}" class="underline">去注册</a>
  </div>
</div>
{% endblock %}
